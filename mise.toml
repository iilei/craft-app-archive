[tools]
# jq parses GitHub release metadata; git/curl/bash/gpg are expected from the host
# (Git Bash on Windows, or the usual Linux command-line tools).
jq = "1.8.1"
# Wiki archive: Node matches storytold/craft-wiki's .nvmrc (22); Go builds the viewer.
node = "22.23.4"
go = "1.25.14"

[tasks."keys:fetch"]
description = "Fetch the pinned Craft release signing key and verify its full fingerprint"
run = "bash scripts/fetch-release-key.sh"

[tasks."apps:fmt"]
description = "Align apps.txt into fixed-width columns (2+ spaces apart, \"-\" for empty cells)"
run = '''
jq -Rrs -f scripts/format-apps.jq apps.txt > apps.txt.tmp && mv apps.txt.tmp apps.txt || { rm -f apps.txt.tmp; exit 1; }
'''

[tasks."apps:check"]
description = "Fail if apps.txt is not formatted (run mise run apps:fmt to fix)"
run = "jq -Rrs -f scripts/format-apps.jq apps.txt | diff -u apps.txt -"

[tasks."wiki:build"]
description = "Clone storytold/craft-wiki and build its static site into the archive"
run = "bash scripts/archive-wiki.sh build"

[tasks."wiki:launcher:build"]
description = "Cross-compile the local wiki viewer for the selected targets"
usage = '''
flag "--targets <targets>" help="Comma-separated targets (default: all): windows-amd64,windows-arm64,darwin-amd64,darwin-arm64,linux-amd64,linux-arm64"
'''
run = 'bash scripts/archive-wiki.sh launcher ${usage_targets:+--targets "$usage_targets"}'

[tasks."wiki:archive"]
description = "Build the wiki and viewers, then write provenance.toml and README.txt"
usage = '''
flag "--targets <targets>" help="Comma-separated viewer targets (default: all)"
'''
run = 'bash scripts/archive-wiki.sh archive ${usage_targets:+--targets "$usage_targets"}'

[tasks."wiki:launch"]
description = "Print the viewer command for this machine"
run = "bash scripts/archive-wiki.sh launch"

[tasks.archive]
description = "Shallow-clone Craft Apps and archive latest release installers with provenance"
usage = '''
flag "-d --depth <depth>" default="20" help="Git history depth for each clone"
flag "--destination <path>" default="craft-archive" help="Archive output root directory"
flag "--macos" default="true" negate="--no-macos" help="Download the macOS universal DMG"
flag "--windows-x64" default="true" negate="--no-windows-x64" help="Download the Windows x64 portable package; skipped when the release has none"
flag "--windows-arm64" default="false" help="Download the Windows ARM64 portable package"
flag "--windows-x86" default="false" help="Download the Windows x86 portable package"
flag "--linux-x86_64-deb" default="true" negate="--no-linux-x86_64-deb" help="Download Linux x86_64 Debian package"
flag "--linux-x86_64-appimage" default="false" help="Download Linux x86_64 AppImage"
flag "--linux-x86_64-flatpak" default="false" help="Download Linux x86_64 Flatpak"
flag "--linux-x86_64-rpm" default="false" help="Download Linux x86_64 RPM"
flag "--linux-x86_64-tar-gz" default="false" help="Download Linux x86_64 tar.gz bundle"
flag "--linux-x86_64-pkg-tar-zst" default="false" help="Download Linux x86_64 Arch package"
flag "--linux-aarch64-deb" default="false" help="Download Linux ARM64/aarch64 Debian package"
flag "--linux-aarch64-appimage" default="false" help="Download Linux ARM64/aarch64 AppImage"
flag "--linux-aarch64-flatpak" default="false" help="Download Linux ARM64/aarch64 Flatpak"
flag "--linux-aarch64-rpm" default="false" help="Download Linux ARM64/aarch64 RPM"
flag "--linux-aarch64-tar-gz" default="false" help="Download Linux ARM64/aarch64 tar.gz bundle"
flag "--linux-aarch64-pkg-tar-zst" default="false" help="Download Linux ARM64/aarch64 Arch package"
flag "--linux-riscv64-deb" default="false" help="Download Linux RISC-V 64-bit Debian package"
flag "--linux-riscv64-rpm" default="false" help="Download Linux RISC-V 64-bit RPM"
flag "--linux-riscv64-tar-gz" default="false" help="Download Linux RISC-V 64-bit tar.gz bundle"
flag "--overwrite" default="false" help="Replace an existing archive directory"
flag "--verify-signatures" default="true" negate="--no-verify-signatures" help="Verify available release signatures (disable with --no-verify-signatures or NO_VERIFY_SIGNATURE=1)"
'''
shell = "bash -c"
run = '''
set -euo pipefail

requested_destination="$usage_destination"
target_parent="$(dirname "$requested_destination")"
target_name="$(basename "$requested_destination")"
[[ -n "$target_name" && "$target_name" != / && "$target_name" != . && "$target_name" != .. ]] || {
  echo "Invalid archive destination: $requested_destination" >&2
  exit 1
}
mkdir -p "$target_parent"
target_parent="$(cd "$target_parent" && pwd -P)"
target="$target_parent/$target_name"
if [[ -e "$target" || -L "$target" ]]; then
  if [[ "$usage_overwrite" != true ]]; then
    echo "Destination exists: $target (pass --overwrite to replace it)" >&2
    exit 1
  fi
fi

verify_signatures="$usage_verify_signatures"
case "${NO_VERIFY_SIGNATURE:-}" in
  1|true|yes|on|TRUE|YES|ON) verify_signatures=false ;;
esac
if [[ "$verify_signatures" == true ]]; then
  bash scripts/fetch-release-key.sh
fi

stage="$(mktemp -d "$target_parent/.$target_name.stage.XXXXXX")"
backup=""
cleanup() {
  status=$?
  if [[ -n "$backup" && -e "$backup" && ! -e "$target" && ! -L "$target" ]]; then
    mv "$backup" "$target" || echo "WARNING: could not restore previous archive from $backup" >&2
  fi
  if [[ -n "$stage" && -e "$stage" ]]; then
    rm -rf -- "$stage"
  fi
  return "$status"
}
trap cleanup EXIT

archive_args=(--depth "$usage_depth" --destination "$stage" --overwrite)
if [[ "$usage_macos" != true ]]; then
  archive_args+=(--macos false)
fi
if [[ "$usage_windows_x64" != true ]]; then
  archive_args+=(--windows-x64 false)
fi
if [[ "$usage_windows_arm64" != false ]]; then
  archive_args+=(--windows-arm64 "$usage_windows_arm64")
fi
if [[ "$usage_windows_x86" != false ]]; then
  archive_args+=(--windows-x86 "$usage_windows_x86")
fi
for asset_key in \
  linux-x86_64-deb linux-x86_64-appimage linux-x86_64-flatpak linux-x86_64-rpm \
  linux-x86_64-tar-gz linux-x86_64-pkg-tar-zst \
  linux-aarch64-deb linux-aarch64-appimage linux-aarch64-flatpak linux-aarch64-rpm \
  linux-aarch64-tar-gz linux-aarch64-pkg-tar-zst \
  linux-riscv64-deb linux-riscv64-rpm linux-riscv64-tar-gz; do
  usage_var="usage_${asset_key//-/_}"
  archive_args+=(--asset "$asset_key" "${!usage_var}")
done
if [[ "$usage_verify_signatures" != true ]]; then
  archive_args+=(--verify-signatures false)
fi

CRAFT_GPG_KEY_FILE="$(pwd)/keys/storytold-release-key.asc" \
CRAFT_GPG_FINGERPRINT="2B76741B414AAD6CD33E631213A005C0B9D7C3ED" \
bash scripts/archive-craft-apps.sh "${archive_args[@]}"

if [[ -e "$target" || -L "$target" ]]; then
  backup="$(mktemp -d "$target_parent/.$target_name.backup.XXXXXX")"
  rmdir "$backup"
  mv "$target" "$backup"
  if ! mv "$stage" "$target"; then
    mv "$backup" "$target"
    backup=""
    echo "Could not install completed archive; restored previous destination." >&2
    exit 1
  fi
  stage=""
  rm -rf -- "$backup"
  backup=""
else
  mv "$stage" "$target"
  stage=""
fi

echo "Done: $target"
'''
